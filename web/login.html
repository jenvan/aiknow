<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · AiKnow 爱脑</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="max-w-sm w-full mx-4">
        <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-8">
            <div class="text-center mb-8">
                <div class="mx-auto w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-500
                            flex items-center justify-center mb-4 shadow-sm">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="1.9"
                         stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <circle cx="12" cy="5" r="2"/><circle cx="5" cy="12" r="2"/>
                        <circle cx="19" cy="12" r="2"/><circle cx="12" cy="19" r="2"/>
                        <path d="M12 7v5M7 12h5M19 12h-5M12 12v5"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-gray-900">AiKnow <span class="text-gray-400 font-medium">爱脑</span></h1>
                <p class="text-sm text-gray-500 mt-2">AI 知识库管理工具</p>
            </div>

            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">用户名</label>
                    <input type="text" id="username" required autocomplete="username"
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">密码</label>
                    <input type="password" id="password" required autocomplete="current-password"
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>

                <div id="errorMsg" class="hidden text-red-600 text-sm text-center"></div>

                <button type="submit" id="submitBtn"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg text-sm font-medium transition-colors disabled:opacity-50">
                    登录
                </button>
            </form>

            <p class="text-xs text-gray-400 text-center mt-6">
                连续 5 次登录失败将锁定 15 分钟
            </p>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const submitBtn = document.getElementById('submitBtn');

        function showError(text) {
            errorMsg.textContent = text;
            errorMsg.classList.remove('hidden');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');
            submitBtn.disabled = true;

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/v1/admin/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ username, password }),
                });

                const data = await res.json().catch(() => ({}));

                if (res.ok) {
                    // CSRF Token 不在此处保存：后台页面加载时会通过
                    // GET /admin/auth/session 重新取得，避免跨页面传递
                    window.location.href = '/ui/dashboard';
                    return;
                }

                // 429 表示已触发失败锁定，需明确告知而非笼统提示"凭据无效"
                showError(res.status === 429
                    ? (data.error || '登录尝试过多，请稍后再试')
                    : (data.error || '登录失败'));
            } catch (err) {
                showError('网络连接失败');
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
