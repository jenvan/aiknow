<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - AiKnow</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-4">
        <div class="bg-white rounded-xl shadow-lg p-8">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800">AiKnow</h1>
                <p class="text-gray-600 mt-2">AI 知识库管理工具</p>
            </div>

            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">用户名</label>
                    <input type="text" id="username" required autocomplete="username"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">密码</label>
                    <input type="password" id="password" required autocomplete="current-password"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>

                <div id="errorMsg" class="hidden text-red-600 text-sm text-center"></div>

                <button type="submit" id="submitBtn"
                        class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition-colors disabled:opacity-50">
                    登录
                </button>
            </form>

            <p class="text-xs text-gray-500 text-center mt-6">
                连续 5 次登录失败将锁定 15 分钟
            </p>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const submitBtn = document.getElementById('submitBtn');

        function showError(text) {
            errorMsg.textContent = text;
            errorMsg.classList.remove('hidden');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');
            submitBtn.disabled = true;

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/v1/admin/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ username, password }),
                });

                const data = await res.json().catch(() => ({}));

                if (res.ok) {
                    // CSRF Token 不在此处保存：后台页面加载时会通过
                    // GET /admin/auth/session 重新取得，避免跨页面传递
                    window.location.href = '/ui/dashboard';
                    return;
                }

                // 429 表示已触发失败锁定，需明确告知而非笼统提示"凭据无效"
                showError(res.status === 429
                    ? (data.error || '登录尝试过多，请稍后再试')
                    : (data.error || '登录失败'));
            } catch (err) {
                showError('网络连接失败');
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
