<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiKnow - AI 知识库</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="/web/css/main.css">
</head>
<body class="bg-gray-50">
    <div id="app" x-data="app()">
        <!-- 登录态检查 -->
        <template x-if="!isLoggedIn">
            <div class="min-h-screen flex items-center justify-center">
                <div class="text-center">
                    <h1 class="text-2xl font-bold text-gray-800 mb-4">AiKnow</h1>
                    <p class="text-gray-600 mb-8">AI 知识库管理工具</p>
                    <a href="/ui/login" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">
                        登录
                    </a>
                </div>
            </div>
        </template>

        <!-- 已登录：显示布局 -->
        <template x-if="isLoggedIn">
            <div class="flex h-screen">
                <!-- 侧边栏 -->
                <aside class="w-64 bg-gray-900 text-white flex flex-col">
                    <div class="p-4 border-b border-gray-800">
                        <h1 class="text-xl font-bold">AiKnow</h1>
                    </div>
                    <nav class="flex-1 p-4">
                        <ul class="space-y-2">
                            <li>
                                <a href="/ui/dashboard"
                                   class="flex items-center px-4 py-2 rounded-lg hover:bg-gray-800"
                                   :class="{ 'bg-gray-800': currentPage === 'dashboard' }">
                                    <span>仪表盘</span>
                                </a>
                            </li>
                            <li>
                                <a href="/ui/articles"
                                   class="flex items-center px-4 py-2 rounded-lg hover:bg-gray-800"
                                   :class="{ 'bg-gray-800': currentPage === 'articles' }">
                                    <span>文章列表</span>
                                </a>
                            </li>
                            <li>
                                <a href="/ui/articles/new"
                                   class="flex items-center px-4 py-2 rounded-lg hover:bg-gray-800"
                                   :class="{ 'bg-gray-800': currentPage === 'new-article' }">
                                    <span>录入文章</span>
                                </a>
                            </li>
                            <li>
                                <a href="/ui/search"
                                   class="flex items-center px-4 py-2 rounded-lg hover:bg-gray-800"
                                   :class="{ 'bg-gray-800': currentPage === 'search' }">
                                    <span>检索测试</span>
                                </a>
                            </li>
                            <li>
                                <a href="/ui/settings"
                                   class="flex items-center px-4 py-2 rounded-lg hover:bg-gray-800"
                                   :class="{ 'bg-gray-800': currentPage === 'settings' }">
                                    <span>系统配置</span>
                                </a>
                            </li>
                        </ul>
                    </nav>
                    <div class="p-4 border-t border-gray-800">
                        <button @click="logout()" class="w-full text-left px-4 py-2 rounded-lg hover:bg-gray-800">
                            退出登录
                        </button>
                    </div>
                </aside>

                <!-- 主内容区 -->
                <main class="flex-1 overflow-auto">
                    <div id="page-content">
                        <!-- 页面内容将通过 Alpine.js 动态加载 -->
                        <div x-show="currentPage === 'dashboard'" x-transition>
                            <div class="p-6">
                                <h2 class="text-2xl font-bold text-gray-800 mb-4">仪表盘</h2>
                                <p class="text-gray-600">加载中...</p>
                            </div>
                        </div>
                        <div x-show="currentPage === 'articles'" x-transition>
                            <div class="p-6">
                                <h2 class="text-2xl font-bold text-gray-800 mb-4">文章列表</h2>
                                <p class="text-gray-600">加载中...</p>
                            </div>
                        </div>
                        <!-- 系统配置：defaults 提供完整配置清单，overrides 标出已修改项 -->
                        <div x-show="currentPage === 'settings'" x-transition>
                            <div x-data="settings" class="p-6">
                                <div class="flex items-center justify-between mb-6">
                                    <div>
                                        <h2 class="text-2xl font-bold text-gray-800">系统配置</h2>
                                        <p class="text-sm text-gray-500 mt-1">
                                            L2 业务配置热生效；留空/默认值需参考启动配置的项（如采集 User-Agent）会回落到 config.yaml
                                        </p>
                                    </div>
                                    <button @click="resetAll()"
                                            class="px-4 py-2 text-sm border border-gray-300 rounded-lg hover:bg-gray-50"
                                            x-show="!loading">
                                        恢复所有默认
                                    </button>
                                </div>

                                <div x-show="message"
                                     class="mb-4 px-4 py-3 rounded-lg text-sm"
                                     :class="messageId === 'success' ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'">
                                    <span x-text="message"></span>
                                </div>

                                <div x-show="loading" class="text-gray-500">加载中...</div>

                                <template x-for="group in groups" :key="group.label">
                                    <div class="bg-white rounded-lg shadow mb-6">
                                        <h3 class="text-lg font-semibold text-gray-800 px-6 py-4 border-b"
                                            x-text="group.label"></h3>
                                        <div class="p-6 space-y-4">
                                            <template x-for="field in group.fields" :key="field.key">
                                                <div class="flex items-start justify-between gap-6">
                                                    <div class="pt-1 min-w-0">
                                                        <div class="font-medium text-gray-800" x-text="field.key"></div>
                                                        <div class="text-xs mt-1">
                                                            <span x-show="field.override"
                                                                  class="text-amber-600">后台已修改</span>
                                                            <span x-show="!field.override"
                                                                  class="text-gray-400">默认值</span>
                                                        </div>
                                                    </div>
                                                    <div class="flex items-center gap-2 flex-shrink-0">
                                                        <textarea x-show="field.type === 'textarea'"
                                                                  x-model="field.value" rows="3"
                                                                  class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm w-96"></textarea>
                                                        <input x-show="field.type !== 'textarea'"
                                                               :type="field.type"
                                                               :step="field.type === 'number' ? 'any' : undefined"
                                                               x-model="field.value"
                                                               @keyup.enter="saveField(field)"
                                                               class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm w-96">
                                                        <button @click="saveField(field)"
                                                                class="px-4 py-1.5 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700"
                                                                :disabled="saving">
                                                            保存
                                                        </button>
                                                        <button @click="resetField(field)"
                                                                x-show="field.override"
                                                                class="px-4 py-1.5 text-sm border border-gray-300 rounded-lg hover:bg-gray-50">
                                                            重置
                                                        </button>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </template>
    </div>

    <script src="/web/js/pages/settings.js"></script>
    <script src="/web/js/app.js"></script>
</body>
</html>
