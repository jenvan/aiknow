# AiKnow 本地/单机部署编排
#
# 启动：docker compose up -d
# 首次启动前请准备 .env（可由 .env.example 复制），至少填写：
#   POSTGRES_PASSWORD、SESSION_SECRET、ADMIN_PASSWORD_HASH（或 ADMIN_PASSWORD）
#
# 说明：DATABASE_URL 在下方按 compose 内网地址拼装，无需在 .env 中另行设置。

services:
  postgres:
    # ParadeDB 内置 pgvector / pg_search / pg_cron
    # 版本必须钉死：pg_search 的索引 DDL 与查询语法在 0.25.0 发生过不兼容变更
    image: paradedb/paradedb:0.25.6-pg17
    container_name: aiknow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aiknow}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 扩展创建脚本，仅在数据目录为空（首次初始化）时执行。
      # 同一文件也用于本地开发手动初始化（make db-init），是扩展创建的唯一来源。
      - ./docker-compose-initdb.sql:/docker-entrypoint-initdb.d/000_init.sql:ro
    ports:
      # 默认仅监听回环地址，避免数据库直接暴露到公网
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # 探测扩展是否就绪，而非仅探测端口：应用启动即执行迁移，
      # 迁移依赖 pg_search / vector 已创建
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-aiknow}" -q &&
          psql -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-aiknow}" -tAc
          "SELECT count(*) FROM pg_extension WHERE extname IN ('vector','pg_search')" | grep -q '^2$$'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: aiknow:${VERSION:-dev}
    container_name: aiknow-app
    restart: unless-stopped
    depends_on:
      postgres:
        # 等待扩展就绪后再启动，否则迁移会失败
        condition: service_healthy
    environment:
      # 数据库连接串由 compose 拼装，指向服务名 postgres。
      # .env 中的 DATABASE_URL 不会传入容器。
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aiknow}?sslmode=disable

      # 容器内监听端口。此前硬编码为 8080，导致 .env 中的 PORT 在 compose 下无效。
      PORT: ${PORT:-8080}

      # 本编排面向本地测试，通过 HTTP 访问，故默认 development。
      #
      # 设为 production 会启用 Cookie 的 Secure 标记，浏览器在 HTTP 下不会回传
      # Cookie，将无法登录 —— 真正的生产部署需在前面放置 TLS 终止的反向代理，
      # 详见 docs/DEPLOY.md 第八章。
      APP_ENV: ${APP_ENV:-development}

      # 凭据类配置从 .env 透传
      SESSION_SECRET: ${SESSION_SECRET:?请在 .env 中设置 SESSION_SECRET（至少 32 字符）}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-24h}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      # AI Provider 选择，缺省 mock（无需凭据）
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-mock}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-}
      BAAI_API_KEY: ${BAAI_API_KEY:-}
      BAAI_BASE_URL: ${BAAI_BASE_URL:-}
    ports:
      # 容器侧端口须与上方 PORT 一致，否则映射指向未监听的端口
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:${PORT:-8080}"

volumes:
  pgdata:
