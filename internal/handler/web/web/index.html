<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiKnow - AI 知识库</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="/web/css/main.css">
</head>
<body class="bg-gray-50">
    <div id="app" x-data="app()">
        <!-- 登录态检查 -->
        <template x-if="!isLoggedIn">
            <div class="min-h-screen flex items-center justify-center">
                <div class="text-center">
                    <h1 class="text-2xl font-bold text-gray-800 mb-4">AiKnow</h1>
                    <p class="text-gray-600 mb-8">AI 知识库管理工具</p>
                    <a href="/ui/login" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">
                        登录
                    </a>
                </div>
            </div>
        </template>

        <!-- 已登录：显示布局 -->
        <template x-if="isLoggedIn">
            <div class="flex h-screen">
                <!-- 侧边栏 -->
                <aside class="w-64 bg-gray-900 text-white flex flex-col">
                    <div class="p-4 border-b border-gray-800">
                        <h1 class="text-xl font-bold">AiKnow</h1>
                    </div>
                    <nav class="flex-1 p-4">
                        <ul class="space-y-2">
                            <li>
                                <a href="/ui/dashboard"
                                   class="flex items-center px-4 py-2 rounded-lg hover:bg-gray-800"
                                   :class="{ 'bg-gray-800': currentPage === 'dashboard' }">
                                    <span>仪表盘</span>
                                </a>
                            </li>
                            <li>
                                <a href="/ui/articles"
                                   class="flex items-center px-4 py-2 rounded-lg hover:bg-gray-800"
                                   :class="{ 'bg-gray-800': currentPage === 'articles' }">
                                    <span>文章列表</span>
                                </a>
                            </li>
                            <li>
                                <a href="/ui/articles/new"
                                   class="flex items-center px-4 py-2 rounded-lg hover:bg-gray-800"
                                   :class="{ 'bg-gray-800': currentPage === 'new-article' }">
                                    <span>录入文章</span>
                                </a>
                            </li>
                            <li>
                                <a href="/ui/search"
                                   class="flex items-center px-4 py-2 rounded-lg hover:bg-gray-800"
                                   :class="{ 'bg-gray-800': currentPage === 'search' }">
                                    <span>检索测试</span>
                                </a>
                            </li>
                            <li>
                                <a href="/ui/settings"
                                   class="flex items-center px-4 py-2 rounded-lg hover:bg-gray-800"
                                   :class="{ 'bg-gray-800': currentPage === 'settings' }">
                                    <span>系统配置</span>
                                </a>
                            </li>
                        </ul>
                    </nav>
                    <div class="p-4 border-t border-gray-800">
                        <button @click="logout()" class="w-full text-left px-4 py-2 rounded-lg hover:bg-gray-800">
                            退出登录
                        </button>
                    </div>
                </aside>

                <!-- 主内容区 -->
                <main class="flex-1 overflow-auto">
                    <div id="page-content">
                        <!-- 页面内容将通过 Alpine.js 动态加载 -->
                        <div x-show="currentPage === 'dashboard'" x-transition>
                            <div class="p-6">
                                <h2 class="text-2xl font-bold text-gray-800 mb-4">仪表盘</h2>
                                <p class="text-gray-600">加载中...</p>
                            </div>
                        </div>
                        <div x-show="currentPage === 'articles'" x-transition>
                            <div class="p-6">
                                <h2 class="text-2xl font-bold text-gray-800 mb-4">文章列表</h2>
                                <p class="text-gray-600">加载中...</p>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </template>
    </div>

    <script src="/web/js/app.js"></script>
</body>
</html>
